default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>

development:
  <<: *default
  database: ok_padel_development

test:
  <<: *default
  database: ok_padel_test

production:
  primary: &primary_production
    <<: *default
    database: ok_padel_production
    username: <%= ENV.fetch("DATABASE_USERNAME", "ok_padel") %>
    password: <%= ENV["OK_PADEL_DATABASE_PASSWORD"] %>
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  cache:
    <<: *primary_production
    database: ok_padel_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: ok_padel_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: ok_padel_production_cable
    migrations_paths: db/cable_migrate
