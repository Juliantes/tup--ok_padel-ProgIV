$kind: http-request
description: El usuario debe estar inscripto en el partido (p. ej. después de **Join**).
url: "{{baseUrl}}/api/v1/matches/{{matchId}}/leave"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Match returned with required fields', function () {
          const match = pm.response.json().match;
          pm.expect(match).to.be.an('object');
          pm.expect(match).to.have.property('id');
          pm.expect(match).to.have.property('status');
      });
    language: text/javascript
order: 4000
