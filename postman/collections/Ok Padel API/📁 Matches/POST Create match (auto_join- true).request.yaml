$kind: http-request
name: "POST Create match (auto_join: true)"
url: "{{baseUrl}}/api/v1/matches"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "court_id": 1,
      "date": "2026-12-25T10:00:00-03:00",
      "duration": 90,
      "roster_mode": "pairs",
      "level_required": "fifth",
      "auto_join": true
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Match created and matchId saved', function () {
          const match = pm.response.json().match;
          pm.expect(match).to.be.an('object');
          pm.expect(match).to.have.property('id');
          pm.expect(match.match_players.length).to.be.at.least(1);
          pm.environment.set('matchId', String(match.id));
      });

      pm.test('Match has required fields', function () {
          const match = pm.response.json().match;
          pm.expect(match).to.have.property('status');
          pm.expect(match).to.have.property('court_id');
          pm.expect(match).to.have.property('date');
      });
    language: text/javascript
order: 6000
