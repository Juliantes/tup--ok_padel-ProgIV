$kind: http-request
name: "POST Create match (auto_join: false)"
description: "Útil antes de **Join**: el creador no queda inscripto."
url: "{{baseUrl}}/api/v1/matches"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "court_id": 1,
      "date": "2026-12-26T10:00:00-03:00",
      "duration": 90,
      "roster_mode": "pairs",
      "level_required": "fifth",
      "auto_join": false
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Match created without roster and matchId saved', function () {
          const match = pm.response.json().match;
          pm.expect(match.match_players).to.be.an('array').that.is.empty;
          pm.environment.set('matchId', String(match.id));
      });

      pm.test('Match has required fields', function () {
          const match = pm.response.json().match;
          pm.expect(match).to.have.property('id');
          pm.expect(match).to.have.property('status');
          pm.expect(match).to.have.property('court');
          pm.expect(match.court).to.have.property('id');
          pm.expect(match.court).to.have.property('name');
      });
    language: text/javascript
order: 2000
