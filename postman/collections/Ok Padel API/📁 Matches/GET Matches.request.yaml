$kind: http-request
url: "{{baseUrl}}/api/v1/matches"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Matches list and meta present', function () {
          const json = pm.response.json();
          pm.expect(json.matches).to.be.an('array');
          pm.expect(json.meta).to.be.an('object');
      });

      pm.test('Each match has required fields', function () {
          const matches = pm.response.json().matches;
          if (matches.length > 0) {
              matches.forEach(function (match) {
                  pm.expect(match).to.have.property('id');
                  pm.expect(match).to.have.property('status');
              });
          }
      });
    language: text/javascript
order: 1000
