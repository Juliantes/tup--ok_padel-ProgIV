$kind: http-request
description: "Ejecutar tras **Create match (auto_join: false)** o con un partido abierto donde el usuario no esté inscripto."
url: "{{baseUrl}}/api/v1/matches/{{matchId}}/join"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "team": "team_a"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Match players updated', function () {
          const match = pm.response.json().match;
          pm.expect(match.match_players).to.be.an('array');
          pm.expect(match.match_players.length).to.be.at.least(1);
      });

      pm.test('Match has required fields', function () {
          const match = pm.response.json().match;
          pm.expect(match).to.have.property('id');
          pm.expect(match).to.have.property('status');
      });
    language: text/javascript
order: 3000
