$kind: http-request
description: Sin header Authorization.
url: "{{baseUrl}}/api/v1/profile"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Error body present', function () {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty;
      });

      pm.test('No user object in error response', function () {
          pm.expect(pm.response.json()).to.not.have.property('user');
      });
    language: text/javascript
order: 2000
