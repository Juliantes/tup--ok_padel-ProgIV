$kind: http-request
description: Solo el autor del reporte. Borrar el de otro usuario responde 403. `resultId` sale de **POST Report result**.
url: "{{baseUrl}}/api/v1/matches/{{matchId}}/match_results/{{resultId}}"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Results array present', function () {
          pm.expect(pm.response.json().results).to.be.an('array');
      });

      pm.test('resultId cleared from environment', function () {
          pm.environment.set('resultId', '');
      });
    language: text/javascript
order: 4000
