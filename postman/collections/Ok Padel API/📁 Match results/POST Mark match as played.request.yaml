$kind: http-request
description: Jugador activo. Si el partido ya está `completed` con consenso, responde 422. Usar un partido distinto del que ya tiene resultado.
url: "{{baseUrl}}/api/v1/matches/{{matchId}}/played"
method: POST
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Match is completed', function () {
          const match = pm.response.json().match;
          pm.expect(match.status).to.eql('completed');
      });

      pm.test('Match has required fields', function () {
          const match = pm.response.json().match;
          pm.expect(match).to.have.property('id');
          pm.expect(match).to.have.property('status');
      });
    language: text/javascript
order: 2000
