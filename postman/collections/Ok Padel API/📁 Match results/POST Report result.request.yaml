$kind: http-request
description: El usuario del token tiene que ser jugador activo. Un solo reporte cierra consenso provisorio (`completed`). Un segundo POST del mismo jugador responde 422.
url: "{{baseUrl}}/api/v1/matches/{{matchId}}/match_results"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "sets": [
        { "team_a_games": 6, "team_b_games": 4 },
        { "team_a_games": 6, "team_b_games": 4 }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Result saved and resultId stored', function () {
          const json = pm.response.json();
          pm.expect(json.results).to.be.an('array').that.is.not.empty;
          pm.expect(json.consensus).to.be.an('object');
          pm.environment.set('resultId', String(json.results[0].id));
      });

      pm.test('Result has set fields', function () {
          const result = pm.response.json().results[0];
          pm.expect(result).to.have.property('id');
          pm.expect(result.sets).to.be.an('array').that.is.not.empty;
          pm.expect(result.sets[0]).to.have.property('team_a_games');
          pm.expect(result.sets[0]).to.have.property('team_b_games');
          pm.expect(result).to.have.property('winner_team');
      });
    language: text/javascript
order: 3000
