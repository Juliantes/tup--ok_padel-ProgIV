$kind: http-request
description: Público. El detalle del partido ya no trae `match_result`; usa `match_results` y `consensus`.
url: "{{baseUrl}}/api/v1/matches/{{matchId}}/match_results"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Results, consensus and total present', function () {
          const json = pm.response.json();
          pm.expect(json.results).to.be.an('array');
          pm.expect(json).to.have.property('consensus');
          pm.expect(json.total).to.be.a('number');
      });

      pm.test('Each result has required fields', function () {
          const results = pm.response.json().results;
          if (results.length > 0) {
              results.forEach(function (result) {
                  pm.expect(result).to.have.property('id');
                  pm.expect(result).to.have.property('team_a_score');
                  pm.expect(result).to.have.property('team_b_score');
                  pm.expect(result).to.have.property('winner_team');
              });
          }
      });
    language: text/javascript
order: 1000
