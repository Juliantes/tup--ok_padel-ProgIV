$kind: http-request
url: "{{baseUrl}}/api/v1/courts"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Courts array present', function () {
          pm.expect(pm.response.json().courts).to.be.an('array');
      });

      pm.test('Each court has required fields', function () {
          const courts = pm.response.json().courts;
          if (courts.length > 0) {
              courts.forEach(function (court) {
                  pm.expect(court).to.have.property('id');
                  pm.expect(court).to.have.property('name');
              });
          }
      });
    language: text/javascript
order: 1000
