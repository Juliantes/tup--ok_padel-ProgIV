$kind: http-request
url: "{{baseUrl}}/api/v1/courts/0"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () {
          pm.response.to.have.status(404);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Error body present', function () {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty;
      });

      pm.test('No court object in error response', function () {
          pm.expect(pm.response.json()).to.not.have.property('court');
      });
    language: text/javascript
order: 3000
