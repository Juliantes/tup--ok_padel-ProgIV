$kind: http-request
description: Ajustar el id si tu seed no tiene cancha 1.
url: "{{baseUrl}}/api/v1/courts/1"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test('Content-Type is JSON', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });

      pm.test('Court object present with required fields', function () {
          const court = pm.response.json().court;
          pm.expect(court).to.be.an('object');
          pm.expect(court).to.have.property('id');
          pm.expect(court).to.have.property('name');
      });
    language: text/javascript
order: 2000
