$kind: http-request
url: "{{baseUrl}}/api/v1/clubs"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Clubs array present', function () {
          pm.expect(pm.response.json().clubs).to.be.an('array');
      });
    language: text/javascript
order: 1000
