$kind: http-request
url: "{{baseUrl}}/api/v1/clubs"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{playerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 2000
