---
openapi: 3.0.1
info:
  title: Ok Padel API
  version: v1
  description: API REST JSON para jugadores (TP1 Programación IV).
paths:
  "/api/v1/addresses/autocomplete":
    get:
      summary: Autocomplete addresses
      tags:
      - Addresses
      security:
      - bearer_auth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: returns empty for short query
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AddressAutocompleteResponse"
        '401':
          description: returns 401 without a token
  "/api/v1/clubs/{id}/availability":
    parameters:
    - name: id
      in: path
      description: Club ID
      required: true
      schema:
        type: integer
    - name: date
      in: query
      format: date
      description: Schedule date (ISO 8601)
      schema:
        type: string
    get:
      summary: Club availability for players
      tags:
      - Player courts
      security:
      - bearer_auth: []
      responses:
        '200':
          description: returns match_id only for booked matches that are not court-only
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlayerAvailabilityResponse"
        '403':
          description: returns 403 without player role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: returns 422 when date is missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/clubs/{id}/schedule":
    parameters:
    - name: id
      in: path
      description: Club ID
      required: true
      schema:
        type: integer
    - name: date
      in: query
      format: date
      description: Schedule date (ISO 8601)
      schema:
        type: string
    get:
      summary: Club schedule for a date
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      responses:
        '200':
          description: returns empty rows when there are no slots for the weekday
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClubScheduleResponse"
        '422':
          description: returns 422 when date is missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: returns 403 for a player without club_owner role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: returns 404 for a foreign club
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/court_bookings":
    post:
      summary: Create court booking
      tags:
      - Player courts
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: creates a confirmed player booking
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CourtBookingResponse"
        '422':
          description: returns 422 when slot already booked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: returns 403 without player role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                club_id:
                  type: integer
                court_id:
                  type: integer
                time_slot_id:
                  type: integer
                date:
                  type: string
                  format: date
              required:
              - club_id
              - court_id
              - time_slot_id
              - date
  "/api/v1/me/court_bookings":
    get:
      summary: List my court bookings
      tags:
      - Player courts
      security:
      - bearer_auth: []
      responses:
        '200':
          description: returns player bookings with cancellable flag
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CourtBookingsIndexResponse"
  "/api/v1/court_bookings/{id}":
    parameters:
    - name: id
      in: path
      description: Court booking ID
      required: true
      schema:
        type: integer
    delete:
      summary: Cancel court booking
      tags:
      - Player courts
      security:
      - bearer_auth: []
      responses:
        '204':
          description: cancels the booking
        '422':
          description: returns 422 when too late to cancel
  "/api/v1/courts":
    get:
      summary: List courts
      tags:
      - Courts
      security: []
      responses:
        '200':
          description: lists active courts without authentication
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CourtsResponse"
  "/api/v1/courts/{id}":
    parameters:
    - name: id
      in: path
      description: Court ID
      required: true
      schema:
        type: integer
    get:
      summary: Show court
      tags:
      - Courts
      security: []
      responses:
        '200':
          description: returns an active court without authentication
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CourtResponse"
        '404':
          description: returns 404 for missing courts
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/oauth/google":
    post:
      summary: Exchange Firebase ID token for API JWT
      tags:
      - Authentication
      security: []
      parameters: []
      responses:
        '200':
          description: logs in an existing user without overwriting profile fields
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        '401':
          description: returns 401 when the Firebase token is invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
              required:
              - id_token
  "/api/v1/matches/{match_id}/match_results":
    parameters:
    - name: match_id
      in: path
      description: Match ID
      required: true
      schema:
        type: integer
    get:
      summary: List match results
      tags:
      - Match results
      security: []
      responses:
        '200':
          description: returns reports and consensus without authentication
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchResultsIndexResponse"
        '404':
          description: returns 404 for a missing match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Report match result
      tags:
      - Match results
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: lets an active player report a result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchResultsMutationResponse"
        '401':
          description: returns 401 token_missing without a token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedError"
        '422':
          description: returns 422 when the player already reported and the match
            is not in dispute
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sets:
                  type: array
                  items:
                    type: object
                    properties:
                      team_a_games:
                        type: integer
                      team_b_games:
                        type: integer
                    required:
                    - team_a_games
                    - team_b_games
              required:
              - sets
  "/api/v1/matches/{match_id}/match_results/{id}":
    parameters:
    - name: match_id
      in: path
      description: Match ID
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: Match result ID
      required: true
      schema:
        type: integer
    delete:
      summary: Delete match result
      tags:
      - Match results
      security:
      - bearer_auth: []
      responses:
        '200':
          description: lets an admin delete another players result on a completed
            match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchResultsMutationResponse"
        '422':
          description: returns 422 when the reporter deletes from a completed match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: returns 401 token_missing without a token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedError"
        '403':
          description: returns 403 when deleting someone else's result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: returns 404 when the result does not exist
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/matches":
    get:
      summary: List matches
      tags:
      - Matches
      security: []
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by match status (e.g. open, full)
        schema:
          type: string
      - name: court_id
        in: query
        required: false
        schema:
          type: integer
      - name: date
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: caps per_page at 50
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchesResponse"
        '400':
          description: invalid per_page filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create match
      tags:
      - Matches
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: creates a match without enrolling the creator when auto_join
            is false
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchResponse"
        '401':
          description: returns 401 token_missing without a token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedError"
        '422':
          description: returns 422 with invalid params
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                court_id:
                  type: integer
                  nullable: true
                time_slot_id:
                  type: integer
                  nullable: true
                date:
                  type: string
                  format: date-time
                duration:
                  type: integer
                roster_mode:
                  type: string
                  enum:
                  - pairs
                  - individual
                level_required:
                  type: string
                auto_join:
                  type: boolean
                join_policy:
                  type: string
                  enum:
                  - auto
                  - manual
                  - auto_by_level
              required:
              - date
              - duration
              - roster_mode
              - level_required
  "/api/v1/matches/{id}":
    parameters:
    - name: id
      in: path
      description: Match ID
      required: true
      schema:
        type: integer
    get:
      summary: Show match
      tags:
      - Matches
      security: []
      responses:
        '200':
          description: returns a match with details
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchResponse"
        '404':
          description: returns 404 for a missing match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/matches/{id}/join":
    parameters:
    - name: id
      in: path
      description: Match ID
      required: true
      schema:
        type: integer
    post:
      summary: Join match
      tags:
      - Matches
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: joins a match and returns the updated roster
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchResponse"
        '401':
          description: returns 401 token_missing without a token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedError"
        '404':
          description: returns 404 for a missing match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: returns 422 when already actively enrolled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: string
                  enum:
                  - team_a
                  - team_b
  "/api/v1/matches/{id}/leave":
    parameters:
    - name: id
      in: path
      description: Match ID
      required: true
      schema:
        type: integer
    delete:
      summary: Leave match
      tags:
      - Matches
      security:
      - bearer_auth: []
      responses:
        '200':
          description: cancels the match when the creator leaves and nobody remains
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchResponse"
        '401':
          description: returns 401 token_missing without a token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedError"
        '404':
          description: returns 404 when not enrolled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: returns 422 when the creator tries to leave a confirmed match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/me/matches":
    get:
      summary: My matches
      tags:
      - Matches
      security:
      - bearer_auth: []
      responses:
        '200':
          description: returns matches created by or joined by the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Match"
                required:
                - matches
        '401':
          description: returns 401 token_missing without a token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedError"
  "/api/v1/matches/{id}/played":
    parameters:
    - name: id
      in: path
      description: Match ID
      required: true
      schema:
        type: integer
    post:
      summary: Mark match as played
      tags:
      - Matches
      security:
      - bearer_auth: []
      responses:
        '200':
          description: marks the match as played for an active player
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchResponse"
        '401':
          description: returns 401 token_missing without a token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedError"
        '422':
          description: returns 422 when the match is already completed with consensus
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/clubs/{club_id}/courts":
    parameters:
    - name: club_id
      in: path
      description: Club ID
      required: true
      schema:
        type: integer
    get:
      summary: List courts for owned club
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      responses:
        '200':
          description: lists all court statuses for the owner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CourtsResponse"
        '404':
          description: returns 404 for a foreign club
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create court for owned club
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: creates a court
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CourtResponse"
        '422':
          description: returns 422 for invalid color
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                court_type:
                  type: string
                  enum:
                  - indoor
                  - outdoor
                price_per_hour:
                  type: number
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                  - active
                  - maintenance
                  - inactive
                color:
                  type: integer
                  minimum: 0
                  maximum: 4
              required:
              - name
              - court_type
              - price_per_hour
  "/api/v1/clubs/{club_id}/courts/{id}":
    parameters:
    - name: club_id
      in: path
      description: Club ID
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: Court ID
      required: true
      schema:
        type: integer
    get:
      summary: Show court for owned club
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      responses:
        '200':
          description: returns a court
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CourtResponse"
    patch:
      summary: Update court for owned club
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: updates a court
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CourtResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                court_type:
                  type: string
                  enum:
                  - indoor
                  - outdoor
                price_per_hour:
                  type: number
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                  - active
                  - maintenance
                  - inactive
                color:
                  type: integer
                  minimum: 0
                  maximum: 4
    delete:
      summary: Delete court for owned club
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      responses:
        '204':
          description: deletes a court without matches
  "/api/v1/clubs/{club_id}/courts/{court_id}/time_slots":
    parameters:
    - name: club_id
      in: path
      description: Club ID
      required: true
      schema:
        type: integer
    - name: court_id
      in: path
      description: Court ID
      required: true
      schema:
        type: integer
    get:
      summary: List time slots for owned court
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      parameters:
      - name: date
        in: query
        required: false
        description: ISO date for effective slots
        schema:
          type: string
      responses:
        '200':
          description: lists effective slots for a date
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_slots:
                    type: array
                    items:
                      "$ref": "#/components/schemas/OwnerTimeSlot"
                required:
                - time_slots
                "$ref": "#/components/schemas/OwnerTimeSlotsForDateResponse"
        '404':
          description: returns 404 for foreign club
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create time slot
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: creates a time slot
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OwnerTimeSlotResponse"
        '422':
          description: returns 422 when slots overlap
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                day_of_week:
                  type: integer
                start_time:
                  type: string
                  example: '10:00'
                end_time:
                  type: string
                  example: '11:30'
                is_available:
                  type: boolean
              required:
              - day_of_week
              - start_time
              - end_time
  "/api/v1/clubs/{club_id}/courts/{court_id}/time_slots/bulk":
    parameters:
    - name: club_id
      in: path
      description: Club ID
      required: true
      schema:
        type: integer
    - name: court_id
      in: path
      description: Court ID
      required: true
      schema:
        type: integer
    post:
      summary: Bulk replace time slots
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: replaces slots and returns full court list
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_slots:
                    type: array
                    items:
                      "$ref": "#/components/schemas/OwnerTimeSlot"
                required:
                - time_slots
        '422':
          description: blocked by future booking
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                open_time:
                  type: string
                  example: '08:00'
                close_time:
                  type: string
                  example: '23:00'
                duration_minutes:
                  type: integer
                  example: 90
                day_of_weeks:
                  type: array
                  items:
                    type: integer
              required:
              - open_time
              - close_time
              - duration_minutes
              - day_of_weeks
  "/api/v1/clubs/{club_id}/courts/{court_id}/time_slots/day_override":
    parameters:
    - name: club_id
      in: path
      description: Club ID
      required: true
      schema:
        type: integer
    - name: court_id
      in: path
      description: Court ID
      required: true
      schema:
        type: integer
    put:
      summary: Replace time slots for a single date
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: stores override for date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OwnerTimeSlotsForDateResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                slots:
                  type: array
                  items:
                    type: object
                    properties:
                      start_time:
                        type: string
                      end_time:
                        type: string
                      is_available:
                        type: boolean
                    required:
                    - start_time
                    - end_time
              required:
              - date
              - slots
    delete:
      summary: Clear date override
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: removes override
  "/api/v1/clubs/{club_id}/courts/{court_id}/time_slots/{id}":
    parameters:
    - name: club_id
      in: path
      description: Club ID
      required: true
      schema:
        type: integer
    - name: court_id
      in: path
      description: Court ID
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: Time slot ID
      required: true
      schema:
        type: integer
    patch:
      summary: Update time slot
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: updates a time slot
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OwnerTimeSlotResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_available:
                  type: boolean
    delete:
      summary: Delete time slot
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      responses:
        '204':
          description: deletes a time slot
  "/api/v1/clubs":
    get:
      summary: List owned clubs
      tags:
      - Owner clubs
      security:
      - bearer_auth: []
      responses:
        '200':
          description: lists clubs owned by the current user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OwnerClubsResponse"
        '401':
          description: returns 401 without a token
