services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ok_padel_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ok_padel_production" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: ok_padel:local
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_FORCE_SSL: "false"
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/ok_padel_production
      CORS_ORIGINS: http://localhost:4200
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-okpadel}
    ports:
      - "3000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/up || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    image: ok_padel:local
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      DATABASE_URL: postgres://postgres:postgres@db:5432/ok_padel_production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-okpadel}
    command: [ "bin/jobs" ]
    depends_on:
      web:
        condition: service_healthy

  frontend:
    build:
      context: ../tup--padel-match-
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-okpadel}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID}
    image: tup-padel-match:local
    ports:
      - "4200:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
